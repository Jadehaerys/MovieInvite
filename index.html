<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BabyMovieInvite</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>🎬 Movie Night Invitation</h1>

      <div class="movie-poster">
        <label for="posterUpload">Change Poster:</label>
        <input type="file" id="posterUpload" accept="image/*" />
        <img id="movieImage" src="./default-poster.jpg" alt="Movie Poster" />
      </div>

      <form id="invitationForm">
        <label>Date:</label>
        <input type="date" id="movieDate" required />

        <label>Time:</label>
        <input type="time" id="movieTime" required />

        <label>Location:</label>
        <input
          type="text"
          id="movieLocation"
          placeholder="e.g. Ayala Cinemas"
          required
        />

        <button type="submit">Generate Invitation</button>
      </form>

      <div id="invitationOutput" class="hidden">
        <h2>You're Invited! 🍿</h2>
        <p id="outputText"></p>
        <button onclick="copyInvitation()">📋 Copy Invitation</button>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
