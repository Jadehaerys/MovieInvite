        <img src="images/May1.jpg" alt="Her Smile" />
        <img src="images/September.jpg" alt="Sweet Memories" />
      </div>
      <audio id="bg-music" loop>

      </audio>

      <button id="music-toggle">🔈</button>
    </div>

    <script src="index.js"></script>
  </body>
</html>
